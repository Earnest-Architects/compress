<title>Photo Editor — Earnest Architects</title>
<style>
:root{
  --bg:#070b14; --panel2:#111d33; --text:#e6ecf5; --muted:#8ea0bd; --border:#1c2a44;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%; overflow:hidden}
body{
  background:#000; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 18px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:rgba(10,15,26,0.95); border-bottom:1px solid var(--border);
}
header img{height:22px}
header a.back{
  color:var(--muted); text-decoration:none; font-size:13px; padding:6px 12px;
  border:1px solid var(--border); border-radius:8px; background:var(--panel2);
}
header a.back:hover{color:var(--text)}
.frameWrap{flex:1; position:relative}
iframe{width:100%; height:100%; border:0; display:block; background:#000}
</style>
