<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kikaku Platform</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#070b14; --bg2:#0c1220; --panel:#0f1a2e; --panel2:#111d33;
  --accent:#3b5d8c; --accent2:#274063; --accent-glow:#5b82b8;
  --text:#e6ecf5; --muted:#8ea0bd; --border:#1c2a44;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
[hidden]{display:none!important}

/* ---------- ヘッダー / タブ ---------- */
.top{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:8px 18px; background:rgba(10,15,26,.95); border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; flex:none}
.brand img{height:24px; display:block; filter:drop-shadow(0 0 6px rgba(91,130,184,.35))}
.tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  display:inline-flex; align-items:center; gap:8px; flex:none;
  background:transparent; color:var(--muted); border:1px solid transparent; border-radius:10px;
  padding:8px 14px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.tabs button svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
.tabs button:hover{color:var(--text); background:var(--panel2)}
.tabs button[aria-selected="true"]{
  color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:var(--accent-glow); box-shadow:0 2px 12px rgba(59,93,140,.4);
}
.tabs button:focus-visible{outline:2px solid var(--accent-glow); outline-offset:2px}
@media (max-width:700px){
  .top{gap:6px 12px; padding:8px 12px}
  .tabs{order:3; flex:0 0 100%}
}

/* ---------- パネル ---------- */
#views{flex:1; min-height:0; display:flex; flex-direction:column}
.panel{flex:1; min-height:0; display:flex; flex-direction:column}
.frame{position:relative; flex:1; min-height:0; background:var(--bg)}
.frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#000}
.loader{
  position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; gap:10px;
  color:var(--muted); font-size:13px; background:var(--bg); pointer-events:none; transition:opacity .25s;
}
.loader::before{
  content:""; width:16px; height:16px; border-radius:50%;
  border:2px solid var(--border); border-top-color:var(--accent-glow); animation:spin .8s linear infinite;
}
.panel.loaded .loader{opacity:0; visibility:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loader::before{animation-duration:2.4s}}

/* 動画エディターのツールバー */
.bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:6px 14px; background:var(--panel); border-bottom:1px solid var(--border); font-size:12.5px; color:var(--muted);
}
.bar b{color:var(--text); font-weight:600}
.bar .sp{flex:1}
.bar .hint{opacity:.8}
.fbtn{display:inline-flex; align-items:center; cursor:pointer; color:var(--text); background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:5px 11px; font-size:12.5px}
.fbtn:hover{border-color:var(--accent-glow)}
.bar button,.bar a{
  display:inline-flex; align-items:center; gap:6px; color:var(--text); text-decoration:none; font:inherit; font-size:12.5px;
  background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:5px 11px; cursor:pointer;
}
.bar button:hover,.bar a:hover{border-color:var(--accent-glow)}
.bar button:focus-visible,.bar a:focus-visible{outline:2px solid var(--accent-glow); outline-offset:2px}
@media (max-width:700px){.bar .hint{display:none}}

/* ---------- Office サブタブ ---------- */
.subtabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:6px 18px; background:var(--panel); border-bottom:1px solid var(--border)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .sp{flex:1}
.subtabs{align-items:center}
.subhint{font-size:12px; color:var(--muted); white-space:nowrap}
.subopen{color:var(--muted); text-decoration:none; padding:4px 8px; border-radius:6px}
.subopen:hover{color:var(--text); background:var(--panel2)}
@media (max-width:900px){.subhint{display:none}}
.subtabs button{font:inherit; font-size:13px; color:var(--muted); background:transparent; border:1px solid transparent; border-radius:8px; padding:5px 12px; cursor:pointer; white-space:nowrap}
.subtabs button:hover{color:var(--text); background:var(--panel2)}
.subtabs button[aria-selected="true"]{color:var(--text); background:var(--accent2); border-color:var(--accent)}
.subtabs button:focus-visible{outline:2px solid var(--accent-glow); outline-offset:2px}
#subviews{flex:1; min-height:0; display:flex; flex-direction:column}
.ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px; text-align:center; color:var(--muted); font-size:13.5px; line-height:1.7}
.ph b{color:var(--text); font-size:16px}
.ph a{color:var(--accent-glow)}
.ph code{background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:1px 6px; color:var(--text)}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#squish" aria-label="Kikaku Platform"><img src="logo.png" alt="Kikaku Platform"></a>
  <nav class="tabs" role="tablist" aria-label="ツール">
    <button role="tab" id="tab-squish" aria-controls="panel-squish" aria-selected="true" data-tab="squish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      <span>画像圧縮</span>
    </button>
    <button role="tab" id="tab-photo" aria-controls="panel-photo" aria-selected="false" tabindex="-1" data-tab="photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>フォトエディター</span>
    </button>
    <button role="tab" id="tab-office" aria-controls="panel-office" aria-selected="false" tabindex="-1" data-tab="office">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 13h8M9 17h8M9 9h3"/></svg>
      <span>Office</span>
    </button>
    <button role="tab" id="tab-video" aria-controls="panel-video" aria-selected="false" tabindex="-1" data-tab="video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/></svg>
      <span>動画エディター</span>
    </button>
    <button role="tab" id="tab-draw3d" aria-controls="panel-draw3d" aria-selected="false" tabindex="-1" data-tab="draw3d">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12L3 7M12 12v10"/></svg>
      <span>3Dドロワー</span>
    </button>
  </nav>
</header>

<main id="views">
  <section class="panel" id="panel-squish" role="tabpanel" aria-labelledby="tab-squish" data-src="squish.html" data-title="画像圧縮（Squish）">
    <div class="frame"><div class="loader">読み込み中…</div></div>
  </section>

  <section class="panel" id="panel-photo" role="tabpanel" aria-labelledby="tab-photo" data-src="editor.html" data-title="フォトエディター（Photopea）" hidden>
    <div class="frame"><div class="loader">読み込み中…</div></div>
  </section>

  <section class="panel" id="panel-office" role="tabpanel" aria-labelledby="tab-office" hidden>
    <div class="subtabs" role="tablist" aria-label="Office">
      <button role="tab" id="sub-word" aria-selected="true" data-sub="word">Word</button>
      <button role="tab" id="sub-excel" aria-selected="false" data-sub="excel">Excel</button>
      <button role="tab" id="sub-viewer" aria-selected="false" data-sub="viewer">Excelビューア</button>
      <button role="tab" id="sub-ppt" aria-selected="false" data-sub="ppt">PowerPoint</button>
      <button role="tab" id="sub-pdf" aria-selected="false" data-sub="pdf">PDF</button>
      <button role="tab" id="sub-form" aria-selected="false" data-sub="form">フォーム</button>
      <span class="sp"></span><span id="ooHint" class="subhint"></span><a id="ooOpen" class="subopen" href="#" target="_blank" rel="noopener noreferrer">↗</a>
    </div>
    <div id="subviews">
    <section class="panel" id="sub-panel-oo" data-title="ONLYOFFICE" hidden>
      <div class="frame"><div class="loader">読み込み中…</div></div>
    </section>
    <section class="panel" id="sub-panel-viewer" data-title="Excelビューア" data-src="excel/index.html" hidden>
      
      <div class="frame"><div class="loader">読み込み中…</div></div>
    </section>
    </div>
  </section>

  <section class="panel" id="panel-video" role="tabpanel" aria-labelledby="tab-video" data-title="動画エディター（OpenCut）" hidden>
    <div class="bar">
      <span><b>OpenCut</b> · 無料のオープンソース動画エディター</span>
      <span class="hint">表示されない場合は「新しいタブで開く」を使ってください</span>
      <span class="sp"></span>
      <button type="button" id="videoReload">再読み込み</button>
      <a id="videoOpen" href="#" target="_blank" rel="noopener noreferrer">新しいタブで開く ↗</a>
    </div>
    <div class="frame"><div class="loader">読み込み中…</div></div>
  </section>

  <section class="panel" id="panel-draw3d" role="tabpanel" aria-labelledby="tab-draw3d" data-src="hew/index.html" data-title="3Dドロワー（Hew）" hidden>
    <div class="frame"><div class="loader">読み込み中…</div></div>
  </section>
</main>

<script src="config.js"></script>
<script>
(function(){
  const IDS = ["squish","photo","office","video","draw3d"];
  const SUBS = ["word","excel","viewer","ppt","pdf","form"];
  const OO_URL = safeUrl((window.APP_CONFIG && window.APP_CONFIG.OFFICE_URL) || "") || "https://oonxt.github.io/wasm-onlyoffice-demo/";
  const HINTS = {
    word:"「New: DOCX」をクリックして文書を作成、または「Open File…」で .docx を開く",
    excel:"「New: XLSX」をクリックして表を作成、または「Open File…」で .xlsx を開く",
    ppt:"「New: PPTX」をクリックしてスライドを作成、または「Open File…」で .pptx を開く",
    pdf:"「Open File…」で PDF を選択して表示・編集",
    form:"「Open File…」でフォーム付き PDF を選択して入力"
  };
  let curSub = "word";

  function safeUrl(raw){
    if(!raw) return "";
    try{ const u = new URL(raw, location.href); if(u.protocol==="http:"||u.protocol==="https:") return u.href; }catch(e){}
    return "";
  }
  function mount(panelId, src){
    const p = document.getElementById(panelId);
    if(p.querySelector("iframe")) return;
    const f = document.createElement("iframe"); f.title = p.dataset.title || panelId;
    f.allow = "fullscreen; clipboard-read; clipboard-write"; f.allowFullscreen = true;
    f.addEventListener("load", () => p.classList.add("loaded"));
    f.src = src; p.querySelector(".frame").append(f);
  }
  document.getElementById("ooOpen").href = OO_URL;
  function activateSub(id){
    if(!SUBS.includes(id)) id = curSub;
    curSub = id;
    const shown = id === "viewer" ? "viewer" : "oo";
    SUBS.forEach(k => document.getElementById("sub-"+k).setAttribute("aria-selected", k === id ? "true" : "false"));
    ["viewer","oo"].forEach(k => document.getElementById("sub-panel-"+k).hidden = k !== shown);
    if(shown === "viewer"){ document.getElementById("ooHint").textContent = ""; } if(shown === "viewer") mount("sub-panel-viewer", "excel/index.html");
    else { document.getElementById("ooHint").textContent = HINTS[id]; mount("sub-panel-oo", OO_URL); }
  }
    document.querySelectorAll("[data-sub]").forEach(b => b.addEventListener("click", () => { location.hash = "office/" + b.dataset.sub; }));
  const DEFAULT_VIDEO_URL = "https://opencut.app";

  // 動画エディターの URL（config.js）。http(s) 以外は無視して既定値にする
  function videoUrl(){
    const raw = (window.APP_CONFIG && window.APP_CONFIG.VIDEO_EDITOR_URL) || DEFAULT_VIDEO_URL;
    try{
      const u = new URL(raw, location.href);
      if(u.protocol === "http:" || u.protocol === "https:") return u.href;
    }catch(e){}
    return DEFAULT_VIDEO_URL;
  }
  const VIDEO_URL = videoUrl();
  document.getElementById("videoOpen").href = VIDEO_URL;

  // iframe は最初に開いたときだけ作成し、その後はタブを切り替えても状態を保持する
  function ensureFrame(id){
    const panel = document.getElementById("panel-" + id);
    if(panel.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.title = panel.dataset.title || id;
    f.allow = "fullscreen; clipboard-read; clipboard-write; autoplay";
    f.allowFullscreen = true;
    f.addEventListener("load", () => panel.classList.add("loaded"));
    f.src = id === "video" ? VIDEO_URL : panel.dataset.src;
    panel.querySelector(".frame").append(f);
  }

  function activate(hash){
    let [id, sub] = hash.split("/");
    if(id === "excel"){ id = "office"; sub = "viewer"; }
    if(!IDS.includes(id)) id = "squish";
    IDS.forEach(k => {
      const on = k === id;
      const tab = document.getElementById("tab-" + k);
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.tabIndex = on ? 0 : -1;
      document.getElementById("panel-" + k).hidden = !on;
    });
    document.getElementById("tab-" + id).scrollIntoView({block:"nearest", inline:"nearest"});
    if(id === "office") activateSub(sub); else ensureFrame(id);
  }

  document.querySelectorAll(".tabs [role=tab]").forEach(t => {
    t.addEventListener("click", () => { location.hash = t.dataset.tab; });
  });

  // ← → Home End でタブを移動
  document.querySelector(".tabs").addEventListener("keydown", e => {
    const cur = IDS.findIndex(k => document.getElementById("tab-" + k).getAttribute("aria-selected") === "true");
    let next = -1;
    if(e.key === "ArrowRight") next = (cur + 1) % IDS.length;
    else if(e.key === "ArrowLeft") next = (cur - 1 + IDS.length) % IDS.length;
    else if(e.key === "Home") next = 0;
    else if(e.key === "End") next = IDS.length - 1;
    if(next < 0) return;
    e.preventDefault();
    location.hash = IDS[next];
    document.getElementById("tab-" + IDS[next]).focus();
  });

  document.getElementById("videoReload").addEventListener("click", () => {
    const f = document.querySelector("#panel-video iframe");
    if(!f) return;
    document.getElementById("panel-video").classList.remove("loaded");
    f.src = VIDEO_URL;
  });

  // #squish / #photo / #office/word など / #video で直接開ける（ブラウザの戻る・進むにも対応）
  window.addEventListener("hashchange", () => activate(location.hash.slice(1)));
  activate(location.hash.slice(1));

  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
